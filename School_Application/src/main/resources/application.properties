spring.application.name=School_Application

# MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
server.port=${PORT:8080}

# JWT — No default: app MUST have JWT_SECRET set in environment
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CORS — set your frontend URL in production
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,https://school-application-frontend.vercel.app}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logging
logging.level.root=INFO
logging.level.com.example.School_Application=INFO